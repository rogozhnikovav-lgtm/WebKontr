    <script>
        // 1.1 Вернуть число в обратном порядке
function reverseNumber(num) {
    return parseInt(Math.abs(num).toString().split('').reverse().join('')) * Math.sign(num);
}
console.log(reverseNumber(123)); 
console.log(reverseNumber(-456)); 

// 1.2 Вернуть число без повторяющихся цифр
function removeDuplicateDigits(num) {
    const digits = Math.abs(num).toString();
    let uniqueDigits = '';
    
    for (let digit of digits) {
        if (!uniqueDigits.includes(digit)) {
            uniqueDigits += digit;
        }
    }
    
    return parseInt(uniqueDigits) * Math.sign(num);
}

console.log(removeDuplicateDigits(111333456));
    </script>
    <script>
        // 1.3 Посчитать, сколько раз встречается данная цифра
function countDigitOccurrences(num, digit) {
    const numStr = Math.abs(num).toString();
    const digitStr = digit.toString();
    let count = 0;
    
    for (let char of numStr) {
        if (char === digitStr) {
            count++;
        }
    }
    
    return count;
}
console.log(countDigitOccurrences(1355567, 5));
    </script>
    <script>
        // 1.4 Самая длинная последовательность нулей/единиц в двоичной записи
function longestSequenceInBinary(num) {
    const binary = Math.abs(num).toString(2);
    let maxZeros = 0;
    let maxOnes = 0;
    let currentZeros = 0;
    let currentOnes = 0;
    
    for (let bit of binary) {
        if (bit === '0') {
            currentZeros++;
            currentOnes = 0;
            maxZeros = Math.max(maxZeros, currentZeros);
        } else {
            currentOnes++;
            currentZeros = 0;
            maxOnes = Math.max(maxOnes, currentOnes);
        }
    }
    
    return {
        binary: binary,
        longestZeros: maxZeros,
        longestOnes: maxOnes,
        longest: Math.max(maxZeros, maxOnes)
    };
}
console.log(longestSequenceInBinary(125));
    </script>
    <script>
        // 2.1 Найти первый неповторяющийся символ в строке
function firstUniqueChar(str) {
    const charCount = {};
    
    // Подсчитываем количество каждого символа
    for (let char of str) {
        charCount[char] = (charCount[char] || 0) + 1;
    }
    
    // Находим первый символ с количеством 1
    for (let char of str) {
        if (charCount[char] === 1) {
            return char;
        }
    }
    
    return null; // если все символы повторяются
}
console.log(firstUniqueChar('фывфавыапрс'));
    </script>
    <script>
        // 2.2 Сгенерировать строку заданной длины из случайных символов
function generateRandomString(length) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let result = '';
    
    for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * chars.length);
        result += chars[randomIndex];
    }
    
    return result;
}
console.log(generateRandomString(5));
    </script>
    <script>
        // 2.3 Вернуть только уникальные символы строки
function uniqueCharacters(str) {
    const seen = new Set();
    let result = '';
    
    for (let char of str) {
        if (!seen.has(char)) {
            seen.add(char);
            result += char;
        }
    }
    
    return result;
}
console.log(uniqueCharacters('позволяеткопироватьтекст'));
    </script>
